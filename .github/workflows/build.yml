      - name: Commit & Push Patched Files to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat: add Catch Log (سجل صيد) and restrict scope to com.logistics.rider.hungerstation only [skip ci]"
            git push || echo "Notice: git push skipped or branch protected"
          else
            echo "Repository already contains all Catch Log changes."
          fi

      - name: Extract Version Info
        id: check_version
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.36.26"
          fi
          TAG_NAME="v${VERSION_NAME}-hungerstation-log-${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        run: |
          {
            echo "## LocationSpoofer ${{ steps.check_version.outputs.version }} — HungerStation Catch Log (سجل الصيد)"
            echo ""
            echo "### ✨ الميزات والتعديلات المضافة تلقائياً"
            echo "- إضافة شاشة **سجل الصيد (Catch Log / سجل Log)** مع البحث والفلترة المباشرة."
            echo "- تخصيص العمل لحزمة `com.logistics.rider.hungerstation` فقط في `xposed_scope.xml` و`scope.list` و`LocationHooker.kt`."
            echo "- ضبط نظام الإحداثيات الافتراضي إلى `WGS-84`."
          } > changelog.txt

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Signing Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          else
            echo "Generating fallback keystore for release signing..."
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -alias "suse-app-key" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "LinuxisUbuntu18" \
              -keypass "LinuxisUbuntu18" \
              -dname "CN=LocationSpoofer, OU=Dev, O=SUSE, L=Riyadh, S=Riyadh, C=SA"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD:  ${{ secrets.KEYSTORE_PASSWORD || 'LinuxisUbuntu18' }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS || 'suse-app-key' }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD || 'LinuxisUbuntu18' }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

          APK_SRC="app/build/outputs/apk/release"
          APK_NAME="LocationSpoofer-${{ steps.check_version.outputs.tag }}.apk"
          find "$APK_SRC" -name "*.apk" -exec mv {} "$APK_SRC/$APK_NAME" \;
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-${{ steps.check_version.outputs.tag }}
          path: app/build/outputs/apk/release/${{ env.APK_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: "LocationSpoofer ${{ steps.check_version.outputs.version }} — HungerStation Catch Log"
          body_path: changelog.txt
          files: app/build/outputs/apk/release/${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

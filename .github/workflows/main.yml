name: Build APK

on:
  workflow_dispatch:        # تشغيل يدوي بضغطة زر
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} output/LocationSpoofer-debug.apk \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-debug
          path: output/LocationSpoofer-debug.apk
          retention-days: 7
